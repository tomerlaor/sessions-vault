const DAWMark = ({ daw, size = 10 }) => {

// ─── Sidebar ─────────────────────────────────────────────────────────────────

const Sidebar = ({ filter, setFilter, counts, drive }) => {
  const setF = patch => setFilter({ ...filter, ...patch });
  return (
    <aside className="sidebar">
      <div className="drive-card">
        <div className="hdr">
          <span className="dot" />
          <span>Google Drive</span>
          <span style={{ marginLeft:'auto', color:'var(--text-2)', fontWeight:500 }}>{drive.synced}/{drive.total}</span>
        </div>
        <div className="bar"><div style={{ width:`${(drive.synced/drive.total)*100}%` }} /></div>
        <div className="meta">{drive.used} of {drive.quota} used</div>
        <div className="row"><span>Last sync</span><span style={{ color:'var(--text-1)' }}>2 min ago</span></div>
      </div>

      <div className="sb-section-title">Library</div>
      {[
        { id:'all',     label:'All projects', icon:'music' },
        { id:'starred', label:'Starred',       icon:'star' },
        { id:'recent',  label:'Recent',        icon:'history' },
        { id:'dirty',   label:'Needs backup',  icon:'upload' },
      ].map(v => (
        <div key={v.id} className={`sb-item ${filter.view===v.id ? 'active':''}`}
          onClick={() => setF({ view:v.id, collection:null })}>
          <Icon name={v.icon} size={13} />
          <span>{v.label}</span>
          <span className="count">{counts[v.id]}</span>
        </div>
      ))}

      <div className="sb-divider" />
      <div className="sb-section-title">DAWs</div>
      {Object.entries(DAWS).map(([id, d]) => (
        <div key={id} className={`sb-item ${filter.daw===id ? 'active':''}`}
          onClick={() => setF({ daw: filter.daw===id ? null : id })}>
          <div className="swatch" style={{ background:d.color }} />
          <span>{d.name}</span>
          <span className="count">{counts.daw[id] || 0}</span>
        </div>
      ))}

      <div className="sb-divider" />
      <div className="sb-section-title">
        Collections
        <button title="New collection"><Icon name="plus" size={11} /></button>
      </div>
      {COLLECTIONS.map(c => (
        <div key={c.id} className={`sb-item ${filter.collection===c.id ? 'active':''}`}
          onClick={() => setF({ collection: filter.collection===c.id ? null : c.id, view:'all' })}>
          <div className="swatch" style={{ background:c.color }} />
          <span>{c.name}</span>
          <span className="count">{counts.collection[c.id] || 0}</span>
        </div>
      ))}

      <div className="sb-divider" />
      <div className="sb-section-title">Tags</div>
      {ALL_TAGS.slice(0, 8).map(t => (
        <div key={t} className={`sb-item ${filter.tags.includes(t) ? 'active':''}`}
          onClick={() => {
            const has = filter.tags.includes(t);
            setF({ tags: has ? filter.tags.filter(x=>x!==t) : [...filter.tags, t] });
          }}>
          <Icon name="tag" size={11} />
          <span>#{t}</span>
        </div>
      ))}
    </aside>
  );
};

// ─── Project row ─────────────────────────────────────────────────────────────

const StatusDot = ({ status }) => {
  const label = { synced:'Synced', syncing:'Syncing…', dirty:'Changes not synced', pending:'Never synced' }[status];
  return (
    <div className="sync-cell" title={label}>
      <span className={`status-dot ${status}`} />
      <span>{label}</span>
    </div>
  );
};

const ProjectRow = ({ p, selected, onClick, onSync, onOpen, onStar }) => {
  const daw = DAWS[p.daw];
  return (
    <tr className={selected ? 'selected' : ''} onClick={onClick}>
      <td>
        <div className="name-cell">
          <WaveArt wave={p.wave} bg={p.art} size={32} />
          <div className="name">
            <div className="title">
              {p.starred && <span style={{ color:'var(--yellow)', marginRight:4 }}>★</span>}
              {p.title}
            </div>
            <div className="path">{p.path}</div>
          </div>
        </div>
      </td>
      <td>
        <div className="daw-pill" style={{ background:`${daw.color}22`, color:daw.color }}>
          <DAWMark daw={p.daw} size={10} />
          {daw.name}
        </div>
      </td>
      <td><StatusDot status={p.status} /></td>
      <td style={{ color:'var(--text-2)', fontSize:11.5 }}>
        {p.lastSyncLabel}
        {p.status !== 'pending' && <span className="versions" style={{ marginLeft:8 }}>v{p.versions}</span>}
      </td>
      <td style={{ color:'var(--text-2)', fontFamily:'var(--font-mono)', fontSize:11 }}>
        {p.bpm} / {p.key}
      </td>
      <td>
        <div className="tags-cell">
          {(p.tags||[]).slice(0,3).map(t => <span key={t} className="tag">{t}</span>)}
        </div>
      </td>
      <td style={{ color:'var(--text-2)', fontSize:11.5 }}>{p.modifiedLabel}</td>
      <td style={{ color:'var(--text-2)', fontSize:11.5, textAlign:'right' }}>{p.size}</td>
      <td onClick={e => e.stopPropagation()}>
        <div className="row-actions">
          <button className="row-btn" title="Open in DAW" onClick={() => onOpen(p)}><Icon name="open" size={12} /></button>
          <button className="row-btn" title="Sync now" onClick={() => onSync(p)}><Icon name="sync" size={12} /></button>
          <button className="row-btn" title={p.starred ? 'Unstar' : 'Star'} onClick={() => onStar(p)}>
            <Icon name="star" size={12} style={{ color: p.starred ? 'var(--yellow)' : undefined, fill: p.starred ? 'var(--yellow)' : 'none' }} />
          </button>
          <button className="row-btn" title="More"><Icon name="dots" size={12} /></button>
        </div>
      </td>

// ─── List pane ────────────────────────────────────────────────────────────────

const ListPane = ({ projects, filter, setFilter, sort, setSort, selectedId, onSelect, onSync, onOpen, onStar, dropping, onDragOver, onDragLeave, onDrop }) => {
  const activeChips = [];
  if (filter.search) activeChips.push({ key:'search', label:`"${filter.search}"`, clear:() => setFilter({...filter,search:''}) });
  if (filter.daw) activeChips.push({ key:'daw', label:DAWS[filter.daw].name, clear:() => setFilter({...filter,daw:null}) });
  if (filter.collection) {
    const c = COLLECTIONS.find(x => x.id===filter.collection);
    if (c) activeChips.push({ key:'coll', label:c.name, clear:() => setFilter({...filter,collection:null}) });
  }
  filter.tags.forEach(t => activeChips.push({ key:'t-'+t, label:'#'+t, clear:() => setFilter({...filter,tags:filter.tags.filter(x=>x!==t)}) }));

  const sortIcon = key => sort.key===key ? (sort.dir==='asc' ? '↑' : '↓') : '';
  const cols = [
    {key:'title',    label:'Project'},
    {key:'daw',      label:'DAW'},
    {key:'status',   label:'Sync'},
    {key:'lastSync', label:'Last backup / version'},
    {key:'bpm',      label:'BPM / Key'},
    {key:'tags',     label:'Tags'},
    {key:'modified', label:'Modified'},
    {key:'size',     label:'Size'},
    {key:'__',       label:''},
  ];

  const viewLabel = { all:'All projects', starred:'Starred', recent:'Recent', dirty:'Needs backup' }[filter.view] || 'All projects';

  return (
    <div className="list-pane">
      <div className="list-header">
        <h1>{viewLabel}</h1>
        <span className="count">{projects.length}</span>
        <div className="filter-chips">
          {activeChips.map(c => (
            <span key={c.key} className="chip active" onClick={c.clear}>{c.label} <span className="x">✕</span></span>
          ))}
        </div>
      </div>
      <div className="table-wrap" onDragOver={onDragOver} onDragLeave={onDragLeave} onDrop={onDrop}>
        <table className="table">
          <thead>
            <tr>
              {cols.map(c => (
                <th key={c.key} onClick={() => c.key!=='__' && setSort({ key:c.key, dir: sort.key===c.key && sort.dir==='asc' ? 'desc' : 'asc' })}>
                  {c.label}<span className="sort-ind">{sortIcon(c.key)}</span>
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {projects.map(p => (
              <ProjectRow key={p.id} p={p} selected={p.id===selectedId}
                onClick={() => onSelect(p.id)}
                onSync={onSync} onOpen={onOpen} onStar={onStar} />
            ))}
            {projects.length===0 && (
              <tr><td colSpan={9} style={{ textAlign:'center', padding:40, color:'var(--text-3)' }}>No projects match these filters.</td></tr>
            )}
          </tbody>
        </table>
        {dropping && (
          <div className="drop-overlay"><div className="msg">Drop to attach to selected project</div></div>
        )}
      </div>
    </div>
  );
};

const LyricsTab = ({ p, lyrics, setLyrics }) => {
  const [editing, setEditing] = useState(false);
  const lines = lyrics && lyrics.length ? lyrics : [];
  if (editing) {
    const asText = lines.map(l => l.kind==='section' ? `[${l.text}]` : l.text).join('\n');
    return (
      <div className="lyrics-editor">
        <div className="lyrics-toolbar">
          <button title="Bold"><Icon name="bold" size={11} /></button>
          <button title="Italic"><Icon name="italic" size={11} /></button>
          <div style={{ flex:1 }} />
          <button style={{ color:'var(--accent)' }} onClick={() => setEditing(false)}>Done</button>
        </div>
        <textarea className="description-input" style={{ border:'none', borderRadius:0, minHeight:260, background:'var(--bg-0)' }}
          defaultValue={asText}
          onBlur={e => {
            const next = e.target.value.split('\n').map(line => {
              const m = line.match(/^\s*\[(.+)\]\s*$/);
              return m ? {kind:'section',text:m[1]} : {kind:'line',text:line};
            });
            setLyrics(next);
          }} />
      </div>
    );
  }
  if (!lines.length) {
    return (
      <div style={{ textAlign:'center', padding:'40px 20px', color:'var(--text-3)' }}>
        <Icon name="section" size={28} style={{ opacity:0.4, margin:'0 auto 12px', display:'block' }} />
        <div style={{ fontSize:13, marginBottom:12 }}>No lyrics yet.</div>
        <button className="tb-btn primary" onClick={() => { setLyrics([{kind:'section',text:'Verse 1'},{kind:'line',text:''}]); setEditing(true); }}>Start writing</button>
      </div>
    );
  }
  return (
    <div className="lyrics-editor">
      <div className="lyrics-toolbar">
        <button>{p.key||'—'}</button>
        <button>{p.bpm||'—'} BPM</button>
        <div style={{ flex:1 }} />
        <button onClick={() => setEditing(true)} style={{ color:'var(--accent)' }}>✎ Edit</button>
      </div>
      <div className="lyrics-content">
        {lines.map((l,i) => l.kind==='section'
          ? <div key={i} className="section">{l.text}</div>
          : <p key={i}>{l.text||' '}</p>
        )}
      </div>
    </div>
  );
};

const ChordsTab = ({ p }) => {
  if (!p.chords) return (
    <div style={{ textAlign:'center', padding:'40px 20px', color:'var(--text-3)' }}>
      <Icon name="tune" size={28} style={{ opacity:0.4, margin:'0 auto 12px', display:'block' }} />
      <div style={{ fontSize:13, marginBottom:12 }}>No tabs or chord sheet yet.</div>
      <button className="tb-btn primary">Add chord sheet</button>
    </div>
  );
  const lines = p.chords.split('\n').map((line, i) => {
    if (/^\[.*\]/.test(line.trim())) return <div key={i}><span className="c">{line||' '}</span></div>;
    return <div key={i}><span className="l">{line||' '}</span></div>;
  });
  return (
    <>
      <div style={{ display:'flex', gap:6, marginBottom:10 }}>
        <button className="tb-btn">Transpose ↓</button>
        <button className="tb-btn">Transpose ↑</button>
        <span className="tb-btn" style={{ borderColor:'var(--accent)', color:'var(--accent)' }}>Key of {p.key||'—'}</span>
      </div>
      <div className="chord-sheet">{lines}</div>
    </>
  );
};

const AttachmentsTab = ({ p, playing, setPlaying }) => {
  const files = p.attachments||[];
  const [over, setOver] = useState(false);
  const audioFiles = files.filter(f => f.type==='audio');
  const imageFiles = files.filter(f => f.type==='image');
  const docFiles   = files.filter(f => f.type==='doc');
  const AttachIcon = ({ type }) => {
    const cfg = {
      audio: { bg:'linear-gradient(135deg,#ff7a45,#b45309)', icon:<Icon name="waveform" size={14} stroke={1.6} /> },
      image: { bg:'linear-gradient(135deg,#a98bff,#6b21a8)', icon:<Icon name="image" size={13} /> },
      doc:   { bg:'linear-gradient(135deg,#5e9cff,#1e3a8a)', icon:<Icon name="doc" size={13} /> },
    }[type]||{ bg:'var(--bg-3)', icon:'?' };
    return <div className="icn" style={{ background:cfg.bg, color:'#fff' }}>{cfg.icon}</div>;
  };
  return (
    <>
      {audioFiles.length>0 && <>
        <div className="field-label">Audio ({audioFiles.length})</div>
        <div className="attach-grid">
          {audioFiles.map((f,i) => {
            const isPlaying = playing===f.name;
            return (
              <div key={i} className={`attach-item ${isPlaying?'playing':''}`}>
                <button className="play" onClick={() => setPlaying(isPlaying?null:f.name)}>
                  <Icon name={isPlaying?'pause':'play'} size={10} />
                </button>
                <div className="info" style={{ flex:'0 0 auto', maxWidth:150 }}>
                  <div className="fname">{f.name}</div>
                  <div className="fmeta">{f.dur} • {f.size}</div>
                </div>
                <div className="waveform">{(f.wave||W(i*7)).map((v,j) => <span key={j} style={{ height:`${v*100}%` }} />)}</div>
              </div>
            );
          })}
        </div>
      </>}
      {imageFiles.length>0 && <>
        <div className="field-label" style={{ marginTop:16 }}>Images</div>
        <div className="attach-grid">
          {imageFiles.map((f,i) => (
            <div key={i} className="attach-item">
              <AttachIcon type="image" />
              <div className="info"><div className="fname">{f.name}</div><div className="fmeta">{f.size}</div></div>
              <button className="row-btn"><Icon name="dots" size={12} /></button>
            </div>
          ))}
        </div>
      </>}
      {docFiles.length>0 && <>
        <div className="field-label" style={{ marginTop:16 }}>Documents</div>
        <div className="attach-grid">
          {docFiles.map((f,i) => (
            <div key={i} className="attach-item">
              <AttachIcon type="doc" />
              <div className="info"><div className="fname">{f.name}</div><div className="fmeta">{f.size}</div></div>
              <button className="row-btn"><Icon name="dots" size={12} /></button>
            </div>
          ))}
        </div>
      </>}
      <div className={`dropzone`}
        style={over ? { borderColor:'var(--accent)', color:'var(--accent)', background:'rgba(255,122,69,0.08)' } : {}}
        onDragOver={e => { e.preventDefault(); setOver(true); }}
        onDragLeave={() => setOver(false)}
        onDrop={e => { e.preventDefault(); setOver(false); }}>
        Drop audio, images, tabs or notes here — or <span style={{ color:'var(--accent)' }}>browse</span>
      </div>
    </>
  );
};

const SessionsTab = ({ sessions, setSessions }) => {
  const toggle = i => setSessions(sessions.map((s,j) => j===i ? {...s,done:!s.done} : s));
  return (
    <>
      <div className="session-list">
        {(sessions||[]).map((s,i) => (
          <div key={i} className={`session-item ${s.done?'done':''}`} onClick={() => toggle(i)}>
            <div className="check">{s.done && <Icon name="check" size={10} stroke={3} />}</div>
            <span className="txt">{s.text}</span>
          </div>
        ))}
        {(!sessions||sessions.length===0) && <div style={{ textAlign:'center', padding:20, color:'var(--text-3)' }}>No notes yet.</div>}
      </div>
      <div className="dropzone" style={{ marginTop:10 }}><Icon name="plus" size={10} /> Add note</div>
    </>
  );
};

const HistoryTab = ({ p }) => {
  const entries = p.syncHistory||[{ t:p.lastSyncLabel, v:`v${p.versions} • current`, size:p.size }];
  return (
    <>
      <div style={{ display:'flex', gap:10, alignItems:'center', marginBottom:16, padding:'10px 12px', background:'var(--bg-2)', border:'1px solid var(--line)', borderRadius:6 }}>
        <span className={`status-dot ${p.status}`} style={{ width:9, height:9 }} />
        <div style={{ flex:1 }}>
          <div style={{ fontSize:12, color:'var(--text-0)' }}>
            {{ synced:'Up to date on Google Drive', dirty:'Local changes not yet synced', syncing:'Uploading to Google Drive…', pending:'Never synced to Google Drive' }[p.status]}
          </div>
          <div style={{ fontSize:11, color:'var(--text-3)', marginTop:2 }}>{p.versions} version{p.versions===1?'':'s'} • {p.size}</div>
        </div>
        <button className="tb-btn primary" style={{ fontSize:11, padding:'4px 10px' }}>
          {p.status==='syncing' ? 'Pause' : 'Sync now'}
        </button>
      </div>
      <div className="field-label">Version history</div>
      <div className="sync-timeline">
        {entries.map((e,i) => (
          <div key={i} className={`sync-entry ${i===0?'current':''}`}>
            <div className="t">{e.t}</div>
            <div className="s">{e.v} • {e.size}</div>
          </div>
        ))}
      </div>
    </>
  );
};

// ─── Detail panel ─────────────────────────────────────────────────────────────

const DetailPanel = ({ p, onClose, onOpen, onSync, patch }) => {
  const [tab, setTab] = useState('overview');
  if (!p) return null;
  const daw = DAWS[p.daw];
  return (
    <aside className="detail">
      <div className="detail-header">
        <div className="top">
          <WaveArt wave={p.wave} bg={p.art} size={64} />
          <div style={{ flex:1, minWidth:0 }}>
            <h2>{p.title}</h2>
            <div className="path">{p.path}</div>
            <div className="meta-row">
              <span><DAWMark daw={p.daw} size={11} /> <b style={{ marginLeft:4 }}>{daw.name}</b></span>
              <span>{p.size}</span>
              <span>Modified {p.modifiedLabel}</span>
            </div>
          </div>
          <button className="detail-close" onClick={onClose} title="Close"><Icon name="x" size={12} /></button>
        </div>
        <div className="detail-actions">
          <button className="tb-btn primary" onClick={() => onOpen(p)}>
            <Icon name="open" size={12} /> Open in {daw.name}
          </button>
          <button className="tb-btn" onClick={() => onSync(p)} title="Sync now"><Icon name="sync" size={12} /></button>
          <button className="tb-btn" title="Reveal in Finder"><Icon name="folder" size={12} /></button>
          <button className="tb-btn" title="Copy link"><Icon name="link" size={12} /></button>
        </div>
      </div>

      <div className="tabs">
        {TAB_DEFS.map(t => (
          <button key={t.id} className={`tab ${tab===t.id?'active':''}`} onClick={() => setTab(t.id)}>
            <Icon name={t.icon} size={11} />
            {t.label}
            {t.id==='attachments' && p.attachments && <span className="badge">{p.attachments.length}</span>}
            {t.id==='sessions' && (p.sessions||[]).length>0 && <span className="badge">{(p.sessions||[]).filter(s=>!s.done).length}</span>}
          </button>
        ))}
      </div>

      <div className="tab-body">
        {tab==='overview'    && <OverviewTab p={p} desc={p.description||''} setDesc={v => patch({description:v})} />}
        {tab==='lyrics'      && <LyricsTab p={p} lyrics={p.lyrics||[]} setLyrics={v => patch({lyrics:v})} />}
        {tab==='chords'      && <ChordsTab p={p} />}
        {tab==='attachments' && <AttachmentsTab p={p} playing={p._playing||null} setPlaying={v => patch({_playing:v})} />}
        {tab==='sessions'    && <SessionsTab sessions={p.sessions||[]} setSessions={v => patch({sessions:v})} />}
        {tab==='history'     && <HistoryTab p={p} />}
      </div>
    </aside>
  );
};

// ─── Root app ─────────────────────────────────────────────────────────────────

function App() {
  const [projects, setProjects] = useState(INITIAL_PROJECTS);
  const [selectedId, setSelectedId] = useState('p1');
  const [filter, setFilter] = useState({ view:'all', daw:null, collection:null, tags:[], search:'' });
  const [sort, setSort] = useState({ key:'modified', dir:'desc' });
  const [dropping, setDropping] = useState(false);
  const [showDetail, setShowDetail] = useState(true);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [tweaks, setTweaks] = useState({ accent:'#ff7a45', density:'default' });
  const [toast, setToast] = useState(null);

  useEffect(() => {
    document.documentElement.style.setProperty('--accent', tweaks.accent);
    document.body.className = `density-${tweaks.density}`;
  }, [tweaks]);

  // Simulate syncing completing
  useEffect(() => {
    const syncing = projects.find(p => p.status==='syncing');
    if (!syncing) return;
    const t = setTimeout(() => {
      setProjects(prev => prev.map(p => p.id===syncing.id
        ? {...p, status:'synced', lastSyncLabel:'just now', versions:p.versions+1} : p));
      showToast(`${syncing.title} synced • v${syncing.versions+1}`);
    }, 3500);
    return () => clearTimeout(t);
  }, [projects]);

  const showToast = text => { setToast(text); setTimeout(() => setToast(null), 2800); };
  const selected = projects.find(p => p.id===selectedId);
  const patch = p => setProjects(prev => prev.map(x => x.id===selectedId ? {...x,...p} : x));

  const filtered = useMemo(() => {
    let list = projects.slice();
    if (filter.view==='starred') list = list.filter(p => p.starred);
    if (filter.view==='dirty')   list = list.filter(p => p.status==='dirty'||p.status==='pending');
    if (filter.view==='recent')  list = list.slice(0, 6);
    if (filter.daw)        list = list.filter(p => p.daw===filter.daw);
    if (filter.collection) list = list.filter(p => p.collection===filter.collection);
    if (filter.tags.length) list = list.filter(p => filter.tags.every(t => (p.tags||[]).includes(t)));
    if (filter.search) {
      const q = filter.search.toLowerCase();
      list = list.filter(p => p.title.toLowerCase().includes(q) || (p.description||'').toLowerCase().includes(q) || (p.tags||[]).some(t => t.includes(q)));
    }
    const sortOrder = { synced:0, syncing:1, dirty:2, pending:3 };
    list.sort((a,b) => {
      let av = a[sort.key], bv = b[sort.key];
      if (sort.key==='status') { av = sortOrder[av]||0; bv = sortOrder[bv]||0; }
      if (typeof av==='string') av = av.toLowerCase();
      if (typeof bv==='string') bv = bv.toLowerCase();
      if (av < bv) return sort.dir==='asc' ? -1 : 1;
      if (av > bv) return sort.dir==='asc' ? 1 : -1;
      return 0;
    });
    return list;
  }, [projects, filter, sort]);

  const counts = useMemo(() => {
    const c = { all:projects.length, starred:0, recent:Math.min(projects.length,6), dirty:0, daw:{}, collection:{} };
    projects.forEach(p => {
      if (p.starred) c.starred++;
      if (p.status==='dirty'||p.status==='pending') c.dirty++;
      c.daw[p.daw] = (c.daw[p.daw]||0)+1;
      if (p.collection) c.collection[p.collection] = (c.collection[p.collection]||0)+1;
    });
    return c;
  }, [projects]);

  const drive = { synced:projects.filter(p=>p.status==='synced').length, total:projects.length, used:'47.3 GB', quota:'200 GB' };

  const onSync = p => { setProjects(prev => prev.map(x => x.id===p.id ? {...x,status:'syncing',lastSyncLabel:'syncing…'} : x)); showToast(`Syncing ${p.title}…`); };
  const onOpen = p => showToast(`Opening ${p.title} in ${DAWS[p.daw].name}…`);
  const onStar = p => setProjects(prev => prev.map(x => x.id===p.id ? {...x,starred:!x.starred} : x));
  const onDragOver = e => { e.preventDefault(); setDropping(true); };
  const onDragLeave = e => { if (e.currentTarget.contains(e.relatedTarget)) return; setDropping(false); };
  const onDrop = e => {
    e.preventDefault(); setDropping(false);
    if (!selected) return;
    patch({ attachments:[...(selected.attachments||[]), {type:'doc',name:'dropped_file.txt',size:'3 KB'}] });
    showToast(`Attached to ${selected.title}`);
  };

  return (
    <div className="app">
      <div className="titlebar">
        <div className="traffic">
          <div className="dot r"/><div className="dot y"/><div className="dot g"/>
        </div>
        <div className="title" style={{ display:'flex', alignItems:'center', gap:7 }}>
          <svg width="18" height="22" viewBox="6 6 60 68" fill="none" xmlns="http://www.w3.org/2000/svg" style={{ flexShrink:0 }}>
            <rect x="8"  y="8"  width="40" height="9" rx="2.5" fill="#ff5a00"/>
            <rect x="52" y="8"  width="14" height="9" rx="2.5" fill="#ff5a00" opacity="0.3"/>
            <rect x="8"  y="21" width="20" height="9" rx="2.5" fill="rgba(255,255,255,0.14)"/>
            <rect x="32" y="21" width="34" height="9" rx="2.5" fill="rgba(255,255,255,0.14)"/>
            <rect x="8"  y="34" width="30" height="9" rx="2.5" fill="#ff5a00" opacity="0.6"/>
            <rect x="42" y="34" width="24" height="9" rx="2.5" fill="rgba(255,255,255,0.14)"/>
            <rect x="8"  y="47" width="14" height="9" rx="2.5" fill="rgba(255,255,255,0.14)"/>
            <rect x="26" y="47" width="40" height="9" rx="2.5" fill="#ff5a00" opacity="0.85"/>
            <rect x="8"  y="60" width="24" height="9" rx="2.5" fill="#ff5a00" opacity="0.35"/>
            <rect x="36" y="60" width="30" height="9" rx="2.5" fill="rgba(255,255,255,0.14)"/>
          </svg>
          <span style={{ fontSize:13, fontWeight:700, letterSpacing:'-0.01em', color:'var(--text-0)' }}>Sessions</span>
          <span style={{ fontSize:13, fontWeight:700, letterSpacing:'-0.01em', color:'#ff5a00' }}>Vault</span>
        </div>
        <div className="search">
          <Icon name="search" size={12} style={{ color:'var(--text-2)' }} />
          <input placeholder="Search projects, lyrics, tags…" value={filter.search}
            onChange={e => setFilter({...filter,search:e.target.value})} />
          <span className="kbd">⌘K</span>
        </div>
        <div className="tb-actions">
          <button className="tb-btn" onClick={() => showToast('Syncing all projects…')}>
            <Icon name="sync" size={12} /> Sync all
          </button>
          <button className="tb-btn" onClick={() => setTweaksOpen(o=>!o)}>
            <Icon name="tune" size={12} />
          </button>
          <button className="tb-btn primary">
            <Icon name="plus" size={12} /> New
          </button>
        </div>
      </div>

      <Sidebar filter={filter} setFilter={setFilter} counts={counts} drive={drive} />

      <main className={`main ${showDetail?'':'no-detail'}`}>
        <ListPane projects={filtered} filter={filter} setFilter={setFilter}
          sort={sort} setSort={setSort} selectedId={selectedId}
          onSelect={id => { setSelectedId(id); setShowDetail(true); }}
          onSync={onSync} onOpen={onOpen} onStar={onStar}
          dropping={dropping} onDragOver={onDragOver} onDragLeave={onDragLeave} onDrop={onDrop} />
        {showDetail && selected && (
          <DetailPanel p={selected} onClose={() => setShowDetail(false)}
            onOpen={onOpen} onSync={onSync} patch={patch} />
        )}
      </main>

      <div className="statusbar">
        <span>{filtered.length} of {projects.length} projects</span>
        <span className="sep" />
        <span><span className="status-dot synced" style={{ marginRight:5 }}/>{drive.synced} synced</span>
        <span><span className="status-dot dirty" style={{ marginRight:5 }}/>{counts.dirty} need backup</span>
        <div className="right">
          <span>Google Drive · {drive.used} / {drive.quota}</span>
          <span className="sep" />
          <span>Watching ~/Music</span>
        </div>
      </div>

      {toast && (
        <div style={{ position:'fixed', bottom:40, left:'50%', transform:'translateX(-50%)', background:'var(--bg-3)', border:'1px solid var(--line-2)', padding:'8px 14px', borderRadius:8, fontSize:12, boxShadow:'0 8px 24px rgba(0,0,0,0.4)', zIndex:200, whiteSpace:'nowrap' }}>
          {toast}
        </div>
      )}

      {tweaksOpen && (
        <div className="tweaks">
          <div className="hd">
            Tweaks
            <button onClick={() => setTweaksOpen(false)}><Icon name="x" size={10} /></button>
          </div>
          <div className="bd">
            <div className="tweak-row">
              <div className="l">Accent color</div>
              <div className="tweak-opts">
                {[['#ff7a45','orange'],['#5e9cff','blue'],['#a98bff','violet'],['#5cd18b','green'],['#ffcc66','amber']].map(([c,n]) => (
                  <button key={c} className={tweaks.accent===c?'on':''} style={tweaks.accent===c?{background:c,color:'#000',borderColor:c}:{}}
                    onClick={() => setTweaks({...tweaks,accent:c})}>{n}</button>
                ))}
              </div>
            </div>
            <div className="tweak-row">
              <div className="l">Row density</div>
              <div className="tweak-opts">
                {['compact','default','comfortable'].map(d => (
                  <button key={d} className={tweaks.density===d?'on':''}
                    onClick={() => setTweaks({...tweaks,density:d})}>{d}</button>
                ))}
              </div>
            </div>
            <div className="tweak-row">
              <div className="l">Detail panel</div>
              <div className="tweak-opts">
                <button className={showDetail?'on':''} onClick={() => setShowDetail(true)}>Visible</button>
                <button className={!showDetail?'on':''} onClick={() => setShowDetail(false)}>Hidden</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
